<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jawad AI</title>
  
  <!-- Favicon (أيقونة J.ai) -->
  <link rel="icon" type="image/jpg" href="favicon.jpg">
  

  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Marked Library لعرض النصوص المنسقة والكود -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: #131314;
      color: #e3e3e3;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* القائمة الجانبية Sidebar */
    .sidebar {
      width: 260px;
      background-color: #1e1f20;
      display: flex;
      flex-direction: column;
      padding: 15px;
      border-left: 1px solid #2d2f31;
    }

    .new-chat-btn {
      width: 100%;
      padding: 12px;
      background-color: #282a2c;
      color: #fff;
      border: 1px solid #444746;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 15px;
      transition: 0.2s;
    }

    .new-chat-btn:hover {
      background-color: #37393b;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      margin-top: 15px;
    }

    .history-item {
      width: 100%;
      padding: 10px 12px;
      background: none;
      border: none;
      color: #c4c7c5;
      text-align: right;
      cursor: pointer;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item:hover, .history-item.active {
      background-color: #004a77;
      color: #fff;
    }

    .sidebar-footer {
      border-top: 1px solid #2d2f31;
      padding-top: 10px;
    }

    .settings-btn {
      width: 100%;
      padding: 10px;
      background: none;
      border: none;
      color: #c4c7c5;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .settings-btn:hover {
      color: #fff;
    }

    /* منطقة الشات الرئيسية */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .chat-header {
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid #2d2f31;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .welcome-screen {
      text-align: center;
      margin: auto;
    }

    .welcome-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 15px;
      border-radius: 50%;
      object-fit: cover;
    }

    .message {
      max-width: 80%;
      padding: 12px 18px;
      border-radius: 18px;
      line-height: 1.6;
      word-wrap: break-word;
    }

    .user-message {
      align-self: flex-end;
      background-color: #004a77;
      color: #e3e3e3;
      border-bottom-left-radius: 4px;
    }

    .assistant-message {
      align-self: flex-start;
      background-color: #282a2c;
      color: #e3e3e3;
      border-bottom-right-radius: 4px;
    }

    .message pre {
      background-color: #1e1f20;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      margin-top: 8px;
    }

    .chat-input-area {
      padding: 15px 20px;
    }

    .input-form {
      display: flex;
      background-color: #1e1f20;
      border: 1px solid #444746;
      border-radius: 25px;
      padding: 8px 15px;
      align-items: center;
    }

    textarea {
      flex: 1;
      background: none;
      border: none;
      color: #fff;
      outline: none;
      resize: none;
      font-size: 16px;
      max-height: 150px;
    }

    #sendBtn {
      background: none;
      border: none;
      color: #a8c7fa;
      font-size: 18px;
      cursor: pointer;
      padding: 5px 10px;
    }

    /* Modal - نافذة الـ API Key */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #1e1f20;
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .modal input {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #444746;
      background: #131314;
      color: #fff;
      font-size: 14px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .primary-btn {
      background: #a8c7fa;
      color: #040e17;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .secondary-btn {
      background: transparent;
      color: #ccc;
      border: 1px solid #555;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- القائمة الجانبية -->
    <aside class="sidebar">
      <button class="new-chat-btn" id="newChatBtn">
        <i class="fa-solid fa-plus"></i> محادثة جديدة
      </button>
      
      <div class="history-list" id="historyList"></div>

      <div class="sidebar-footer">
        <button class="settings-btn" id="settingsBtn">
          <i class="fa-solid fa-gear"></i> إعدادات كلمه السر
        </button>
      </div>
    </aside>

    <!-- منطقة الشات الرئيسية -->
    <main class="chat-main">
      <header class="chat-header">
        <div class="logo-area">
          <img src="J.ai.png" alt="J.ai Logo" class="header-logo" onerror="this.style.display='none'">
          <h1>Jawad AI</h1>
        </div>
      </header>

      <div class="chat-body" id="chatBody">
        <div class="welcome-screen" id="welcomeScreen">
          <img src="J.ai.png" alt="J.ai Logo" class="welcome-logo" onerror="this.style.display='none'">
          <h2>مرحباً بك في Jawad AI</h2>
          <p>كيف يمكنني مساعدتك اليوم؟</p>
        </div>
      </div>

      <div class="chat-input-area">
        <form class="input-form" id="chatForm">
          <textarea id="userInput" placeholder="اكتب سؤالك هنا..." rows="1" required></textarea>
          <button type="submit" id="sendBtn">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </form>
      </div>
    </main>
  </div>

  <!-- نافذة إدخال API Key -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>إعدادات كلمه السر</h3>
      <p style="font-size: 14px; color: #aaa;">اكتب كلمه السر هنا</p>
      <input type="password" id="apiKeyInput" placeholder="..." />
      <div class="modal-actions">
        <button id="saveKeyBtn" class="primary-btn">حفظ</button>
        <button id="closeModalBtn" class="secondary-btn">إلغاء</button>
      </div>
    </div>
  </div>

  <script>
    const GROQ_API_URL = "https://api.groq.com/openai/v1/chat/completions";
    const DEFAULT_MODEL = "llama-3.3-70b-versatile";

    let apiKey = localStorage.getItem("groq_api_key") || "";
    let conversations = JSON.parse(localStorage.getItem("jawad_chats")) || [];
    let currentChatId = null;

    const chatBody = document.getElementById("chatBody");
    const chatForm = document.getElementById("chatForm");
    const userInput = document.getElementById("userInput");
    const historyList = document.getElementById("historyList");
    const newChatBtn = document.getElementById("newChatBtn");
    const modalOverlay = document.getElementById("modalOverlay");
    const settingsBtn = document.getElementById("settingsBtn");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const saveKeyBtn = document.getElementById("saveKeyBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");

    // توسيع مربع الكتابة تلقائياً
    userInput.addEventListener("input", () => {
      userInput.style.height = "auto";
      userInput.style.height = `${userInput.scrollHeight}px`;
    });

    window.addEventListener("DOMContentLoaded", () => {
      renderHistory();
      if (!apiKey) openModal();
    });

    settingsBtn.addEventListener("click", openModal);
    closeModalBtn.addEventListener("click", closeModal);

    saveKeyBtn.addEventListener("click", () => {
      const key = apiKeyInput.value.trim();
      if (key) {
        apiKey = key;
        localStorage.setItem("groq_api_key", key);
        closeModal();
      } else {
        alert("يرجى إدخال مفتاح API صحيح.");
      }
    });

    newChatBtn.addEventListener("click", startNewChat);

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = userInput.value.trim();
      if (!message) return;

      if (!apiKey) {
        alert("يرجى إدخال Groq API Key أولاً.");
        openModal();
        return;
      }

      userInput.value = "";
      userInput.style.height = "auto";

      if (!currentChatId) {
        createNewChat(message);
      }

      addMessageToUI("user", message);
      saveMessageToChat("user", message);

      const loadingId = addLoadingIndicator();

      try {
        const responseText = await fetchGroqResponse();
        removeMessage(loadingId);
        addMessageToUI("assistant", responseText);
        saveMessageToChat("assistant", responseText);
      } catch (error) {
        removeMessage(loadingId);
        addMessageToUI("assistant", `حدث خطأ: ${error.message}`);
      }
    });

    async function fetchGroqResponse() {
      const chat = conversations.find((c) => c.id === currentChatId);
      const formattedMessages = chat ? chat.messages.map(m => ({ role: m.role, content: m.content })) : [];

      const response = await fetch(GROQ_API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: DEFAULT_MODEL,
          messages: [
            { role: "system", content: "أنت مساعد ذكي ولطيف يدعى Jawad AI." },
            ...formattedMessages
          ],
          temperature: 0.7
        })
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error?.message || "فشل الاتصال بمحرك الذكاء الاصطناعي.");
      }

      const data = await response.json();
      return data.choices[0].message.content;
    }

    function createNewChat(firstMessage) {
      currentChatId = Date.now().toString();
      const newChat = {
        id: currentChatId,
        title: firstMessage.substring(0, 25) + "...",
        messages: []
      };
      conversations.unshift(newChat);
      saveConversations();
      renderHistory();
    }

    function startNewChat() {
      currentChatId = null;
      chatBody.innerHTML = `
        <div class="welcome-screen">
          <img src="J.ai.png" alt="J.ai Logo" class="welcome-logo" onerror="this.style.display='none'">
          <h2>مرحباً بك في Jawad AI</h2>
          <p>كيف يمكنني مساعدتك اليوم؟</p>
        </div>
      `;
      renderHistory();
    }

    function saveMessageToChat(role, content) {
      const chat = conversations.find((c) => c.id === currentChatId);
      if (chat) {
        chat.messages.push({ role, content });
        saveConversations();
      }
    }

    function loadChat(id) {
      currentChatId = id;
      const chat = conversations.find((c) => c.id === id);
      if (!chat) return;

      chatBody.innerHTML = "";
      chat.messages.forEach((m) => addMessageToUI(m.role, m.content));
      renderHistory();
    }

    function saveConversations() {
      localStorage.setItem("jawad_chats", JSON.stringify(conversations));
    }

    function renderHistory() {
      historyList.innerHTML = "";
      conversations.forEach((chat) => {
        const btn = document.createElement("button");
        btn.className = `history-item ${chat.id === currentChatId ? "active" : ""}`;
        btn.innerHTML = `<i class="fa-regular fa-message"></i> <span>${chat.title}</span>`;
        btn.addEventListener("click", () => loadChat(chat.id));
        historyList.appendChild(btn);
      });
    }

    function addMessageToUI(role, content) {
      const welcome = document.getElementById("welcomeScreen");
      if (welcome) welcome.remove();

      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${role}-message`;
      
      const parsedContent = typeof marked !== "undefined" ? marked.parse(content) : content;
      msgDiv.innerHTML = parsedContent;
      
      chatBody.appendChild(msgDiv);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    function addLoadingIndicator() {
      const id = "loading-" + Date.now();
      const loadingDiv = document.createElement("div");
      loadingDiv.className = "message assistant-message";
      loadingDiv.id = id;
      loadingDiv.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري التفكير...`;
      chatBody.appendChild(loadingDiv);
      chatBody.scrollTop = chatBody.scrollHeight;
      return id;
    }

    function removeMessage(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function openModal() {
      apiKeyInput.value = apiKey;
      modalOverlay.classList.add("active");
    }

    function closeModal() {
      modalOverlay.classList.remove("active");
    }
  </script>
</body>
</html>
