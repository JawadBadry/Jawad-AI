<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jawad AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0f12;
      color: #e3e3e3;
      overflow: hidden;
    }

    .app-layout {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* الشريط الجانبي Sidebar */
    .sidebar {
      width: 260px;
      background-color: #131927;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      border-left: 1px solid #1e2d42;
      z-index: 50;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .close-sidebar-btn {
      display: none;
      background: none;
      border: none;
      color: #88a0c0;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .close-sidebar-btn:hover {
      color: #fff;
      background-color: #1c273c;
    }

    .new-chat-btn {
      flex: 1;
      padding: 10px;
      background-color: #007bff;
      border: 1px solid #0056b3;
      color: #fff;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.2s;
      box-shadow: 0 2px 8px rgba(0, 123, 255, 0.25);
    }

    .new-chat-btn:hover {
      background-color: #0056b3;
      box-shadow: 0 4px 12px rgba(0, 123, 255, 0.4);
    }

    .history-list {
      flex: 1;
      margin-top: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      padding: 10px 12px;
      background-color: #182033;
      border: 1px solid #1e2c45;
      border-radius: 8px;
      font-size: 13px;
      color: #c5d4e8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: 0.2s;
    }

    .history-item.active {
      background-color: #007bff;
      border-color: #0056b3;
      color: #fff;
    }

    .history-item:hover {
      background-color: #1d2942;
      color: #fff;
    }

    .history-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #88a0c0;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .delete-btn:hover {
      color: #ff5555;
      background-color: rgba(255, 85, 85, 0.15);
    }

    .sidebar-footer {
      padding-top: 10px;
      border-top: 1px solid #1e2d42;
    }

    .settings-btn {
      background: none;
      border: none;
      color: #88a0c0;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px;
      border-radius: 6px;
    }

    .settings-btn:hover {
      background-color: #182033;
      color: #fff;
    }

    /* منطقة المحادثة Main Chat */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #0d0f12;
      position: relative;
      height: 100%;
    }

    .chat-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1c2536;
      background-color: #0f131a;
    }

    .menu-toggle-btn {
      display: none;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      padding: 6px;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }

    .menu-toggle-btn:hover {
      background-color: #182033;
    }

    .chat-title {
      font-size: 18px;
      font-weight: bold;
      color: #007bff;
      text-shadow: 0 0 10px rgba(0, 123, 255, 0.3);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .user-msg {
      align-self: flex-start;
      background-color: #007bff;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 123, 255, 0.2);
    }

    .ai-msg {
      align-self: flex-end;
      background-color: #131927;
      border: 1px solid #1e2d42;
      color: #e3e3e3;
    }

    .ai-msg.error {
      background-color: #2b1318;
      border-color: #5c1d24;
      color: #ff9999;
    }

    /* صندوق الإدخال السفلي Input Box */
    .chat-input-wrapper {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: #0d0f12;
      border-top: 1px solid #1c2536;
    }

    .chat-input-container {
      flex: 1;
      background-color: #131927;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 2px 14px;
      border: 1px solid #1e2d42;
    }

    .chat-input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      padding: 8px 0;
      font-size: 14px;
    }

    .chat-input::placeholder {
      color: #586982;
    }

    .send-btn {
      background: none;
      border: none;
      color: #007bff;
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .send-btn:hover {
      color: #3395ff;
      transform: scale(1.05);
    }

    .sidebar-overlay {
      display: none;
    }

    /* نافذة كلمة السر Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: #131927;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #1e2d42;
      width: 90%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .modal-content h3 {
      font-size: 16px;
      color: #fff;
    }

    .modal-content input {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #1e2d42;
      background: #0d0f12;
      color: #fff;
      outline: none;
      font-size: 13px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .modal-actions button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-save {
      background: #007bff;
      color: white;
    }

    .btn-save:hover {
      background: #0056b3;
    }

    .btn-cancel {
      background: #182033;
      color: #88a0c0;
    }

    /* خصائص الجوال فقط Media Query */
    @media (max-width: 768px) {
      .menu-toggle-btn {
        display: flex;
      }

      .close-sidebar-btn {
        display: block;
      }

      .sidebar-overlay {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background: rgba(0, 0, 0, 0.75);
        z-index: 40;
      }

      .sidebar-overlay.show {
        display: block;
      }

      .sidebar {
        position: fixed;
        top: 0;
        right: 0;
        height: 100%;
        transform: translateX(100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .chat-messages {
        padding: 12px;
      }

      .msg {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <!-- خلفية تعتيم عند فتح القائمة بالجوال فقط -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- الشريط الجانبي -->
    <div class="sidebar" id="sidebar">
      <div>
        <div class="sidebar-header">
          <button class="close-sidebar-btn" onclick="closeSidebar()" title="إغلاق القائمة">✕</button>
          <button class="new-chat-btn" onclick="createNewChat()">
            <span>+</span> محادثة جديدة
          </button>
        </div>

        <div class="history-list" id="historyList">
          <!-- قائمة المحادثات -->
        </div>
      </div>
      
      <div class="sidebar-footer">
        <button class="settings-btn" onclick="openKeyModal()">
          ⚙️ إعدادات كلمة السر
        </button>
      </div>
    </div>

    <!-- منطقة الشات -->
    <div class="chat-container">
      <div class="chat-header">
        <button class="menu-toggle-btn" onclick="toggleSidebar()" title="القائمة">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="chat-title">Jawad AI</div>
      </div>

      <div class="chat-messages" id="chatMessages">
        <!-- الرسائل -->
      </div>

      <div class="chat-input-wrapper">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
        <div class="chat-input-container">
          <input type="text" id="userInput" class="chat-input" placeholder="اكتب سؤالك هنا..." onkeydown="if(event.key==='Enter') sendMessage()">
        </div>
      </div>
    </div>
  </div>

  <!-- نافذة كلمة السر -->
  <div class="modal" id="keyModal">
    <div class="modal-content">
      <h3>إعداد كلمة السر</h3>
      <input type="password" id="apiKeyInput" placeholder="أدخل كلمة السر الخفية...">
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeKeyModal()">إلغاء</button>
        <button class="btn-save" onclick="saveApiKey()">حفظ</button>
      </div>
    </div>
  </div>

  <script>
    let apiKey = localStorage.getItem('jawad_ai_secret') || '';
    let chats = JSON.parse(localStorage.getItem('jawad_ai_chats')) || [];
    let currentChatId = localStorage.getItem('jawad_ai_current_chat') || null;

    window.onload = () => {
      if (chats.length === 0) {
        createNewChat();
      } else {
        if (!currentChatId || !chats.some(c => c.id === currentChatId)) {
          currentChatId = chats[0].id;
        }
        renderHistory();
        renderMessages();
      }
    };

    function toggleSidebar() {
      if (window.innerWidth <= 768) {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
      }
    }

    function closeSidebar() {
      if (window.innerWidth <= 768) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebarOverlay').classList.remove('show');
      }
    }

    function openKeyModal() {
      document.getElementById('apiKeyInput').value = apiKey;
      document.getElementById('keyModal').style.display = 'flex';
      closeSidebar();
    }

    function closeKeyModal() {
      document.getElementById('keyModal').style.display = 'none';
    }

    function saveApiKey() {
      apiKey = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('jawad_ai_secret', apiKey);
      closeKeyModal();
    }

    function createNewChat() {
      currentChatId = Date.now().toString();
      chats.unshift({
        id: currentChatId,
        title: 'محادثة جديدة',
        messages: []
      });
      saveChatsToStorage();
      renderHistory();
      renderMessages();
      closeSidebar();
    }

    function loadChat(chatId) {
      currentChatId = chatId;
      localStorage.setItem('jawad_ai_current_chat', currentChatId);
      renderHistory();
      renderMessages();
      closeSidebar();
    }

    function deleteChat(chatId, event) {
      event.stopPropagation();
      chats = chats.filter(c => c.id !== chatId);
      
      if (chats.length === 0) {
        createNewChat();
      } else {
        if (currentChatId === chatId) {
          currentChatId = chats[0].id;
        }
        saveChatsToStorage();
        renderHistory();
        renderMessages();
      }
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      chats.forEach(chat => {
        const item = document.createElement('div');
        item.className = 'history-item' + (chat.id === currentChatId ? ' active' : '');
        item.onclick = () => loadChat(chat.id);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.title = 'حذف المحادثة';
        deleteBtn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        `;
        deleteBtn.onclick = (e) => deleteChat(chat.id, e);

        const titleSpan = document.createElement('span');
        titleSpan.className = 'history-title';
        titleSpan.innerText = chat.title;

        item.appendChild(deleteBtn);
        item.appendChild(titleSpan);
        list.appendChild(item);
      });
    }

    function renderMessages() {
      const box = document.getElementById('chatMessages');
      box.innerHTML = '';
      const activeChat = chats.find(c => c.id === currentChatId);
      if (activeChat) {
        activeChat.messages.forEach(m => {
          appendMessageUI(m.text, m.type);
        });
      }
    }

    function appendMessageUI(text, type) {
      const box = document.getElementById('chatMessages');
      const msg = document.createElement('div');
      msg.className = 'msg ' + type;
      msg.innerText = text;
      box.appendChild(msg);
      box.scrollTop = box.scrollHeight;
      return msg;
    }

    function saveChatsToStorage() {
      localStorage.setItem('jawad_ai_chats', JSON.stringify(chats));
      if (currentChatId) {
        localStorage.setItem('jawad_ai_current_chat', currentChatId);
      }
    }

    async function getActiveModel(key) {
      try {
        const res = await fetch("https://api.groq.com/openai/v1/models", {
          headers: { "Authorization": `Bearer ${key}` }
        });
        const data = await res.json();
        if (data.data && data.data.length > 0) {
          const availableModels = data.data.map(m => m.id);
          const preferredList = [
            "llama-3.1-8b-instant",
            "llama3-70b-8192",
            "llama3-8b-8192",
            "mixtral-8x7b-32768",
            "gemma2-9b-it"
          ];

          for (let pref of preferredList) {
            if (availableModels.includes(pref)) return pref;
          }
          return availableModels[0];
        }
      } catch (e) {
        console.error("Failed to fetch models", e);
      }
      return "llama-3.1-8b-instant";
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const prompt = input.value.trim();

      if (!prompt) return;
      if (!apiKey) {
        openKeyModal();
        return;
      }

      const activeChat = chats.find(c => c.id === currentChatId);
      if (!activeChat) return;

      if (activeChat.messages.length === 0) {
        activeChat.title = prompt.length > 20 ? prompt.substring(0, 20) + '...' : prompt;
        renderHistory();
      }

      activeChat.messages.push({ text: prompt, type: 'user-msg' });
      appendMessageUI(prompt, 'user-msg');
      input.value = '';

      const loadingMsg = appendMessageUI('جاري التفكير...', 'ai-msg');

      try {
        const activeModel = await getActiveModel(apiKey);
        const apiMessages = activeChat.messages.map(m => ({
          role: m.type === 'user-msg' ? 'user' : 'assistant',
          content: m.text
        }));

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: activeModel,
            messages: apiMessages
          })
        });

        const data = await response.json();

        if (response.ok && data.choices && data.choices[0]?.message?.content) {
          const replyText = data.choices[0].message.content;
          loadingMsg.innerText = replyText;
          activeChat.messages.push({ text: replyText, type: 'ai-msg' });
        } else {
          const errDetail = data.error ? data.error.message : 'تأكد من كلمة السر.';
          loadingMsg.innerText = 'حدث خطأ: ' + errDetail;
          loadingMsg.classList.add('error');
        }
      } catch (err) {
        loadingMsg.innerText = 'حدث خطأ أثناء الاتصال بالشبكة.';
        loadingMsg.classList.add('error');
      }

      saveChatsToStorage();
    }
  </script>
</body>
</html>
